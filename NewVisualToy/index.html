<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Touch Bubbles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; background-color: #333; }
    </style>
</head>
<body>
    <canvas id="visualCanvas"></canvas>
    <script>
        const canvas = document.getElementById('visualCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Initial size

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 20 + 10; // Random size between 10 and 30
                this.baseColor = `hsl(${Math.random() * 360}, 70%, 70%)`; // Store base HSL color
                this.opacity = 1;
                this.decay = Math.random() * 0.01 + 0.005; // How fast it fades
            }

            update() {
                this.opacity -= this.decay;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                // Correctly construct hsla color string
                const colorParts = this.baseColor.match(/hsl\((.*)\)/);
                if (colorParts && colorParts[1]) {
                    ctx.fillStyle = `hsla(${colorParts[1]}, ${this.opacity})`;
                } else {
                    // Fallback if regex fails, though unlikely with fixed format
                    ctx.fillStyle = `hsla(0, 0%, 0%, ${this.opacity})`;
                }
                ctx.fill();
            }
        }

        function handleInteraction(event) {
            let x, y;
            if (event.touches) {
                event.preventDefault(); // Prevent scrolling/zooming on touch devices
                for (let i = 0; i < event.touches.length; i++) {
                    x = event.touches[i].clientX;
                    y = event.touches[i].clientY;
                    particles.push(new Particle(x, y));
                }
            } else { // Mouse event
                x = event.clientX;
                y = event.clientY;
                particles.push(new Particle(x, y));
            }
        }

        canvas.addEventListener('touchstart', handleInteraction, { passive: false });
        canvas.addEventListener('mousedown', handleInteraction);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
            
            particles = particles.filter(p => p.opacity > 0); // Remove particles that have faded

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate); // Loop animation
        }

        animate(); // Start the animation loop
    </script>
</body>
</html>
