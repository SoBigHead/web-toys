<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>环游片刻 - 360° 全景漫游</title>
    <style>
        :root {
            --text-main: #f3f4f6;
            --text-soft: rgba(243, 244, 246, 0.72);
            --panel-bg: rgba(11, 12, 16, 0.52);
            --panel-strong: rgba(16, 18, 24, 0.78);
            --line-soft: rgba(255, 255, 255, 0.12);
            --line-strong: rgba(255, 209, 131, 0.42);
            --accent: #ffc56f;
            --accent-soft: rgba(255, 197, 111, 0.18);
            --shadow: 0 32px 80px rgba(0, 0, 0, 0.36);
            --radius-xl: 26px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --transition: 220ms ease;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(255, 201, 116, 0.12), transparent 24%),
                radial-gradient(circle at bottom left, rgba(90, 102, 184, 0.12), transparent 30%),
                linear-gradient(180deg, #111216 0%, #090a0d 100%);
            color: var(--text-main);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        body.dragging {
            cursor: grabbing;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            color: inherit;
            background: none;
        }

        .viewer-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #viewer,
        .edge-vignette,
        .stage-frame,
        .grain,
        .drop-layer,
        .scene-transition {
            position: absolute;
            inset: 20px;
            border-radius: 34px;
        }

        #viewer {
            cursor: grab;
            touch-action: none;
            overflow: hidden;
            background: #090a0d;
            box-shadow: var(--shadow);
        }

        #viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .grain,
        .edge-vignette,
        .stage-frame,
        .scene-transition {
            pointer-events: none;
        }

        .grain,
        .edge-vignette,
        .stage-frame {
            z-index: 1;
        }

        .grain {
            opacity: 0.08;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 5px 5px, 5px 5px;
            mix-blend-mode: soft-light;
        }

        .edge-vignette {
            background:
                radial-gradient(circle at center, transparent 46%, rgba(0, 0, 0, 0.14) 74%, rgba(0, 0, 0, 0.5) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.4), transparent 20%, transparent 76%, rgba(0, 0, 0, 0.48));
        }

        .stage-frame {
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        .scene-transition {
            z-index: 2;
            overflow: hidden;
            opacity: 0;
            transition: opacity 160ms ease;
            --magic-primary: rgba(255, 197, 111, 0.66);
            --magic-secondary: rgba(255, 242, 213, 0.42);
            --magic-shadow: rgba(6, 8, 12, 0.72);
        }

        .scene-transition.is-visible {
            opacity: 1;
        }

        .scene-transition[data-magic="ember"] {
            --magic-primary: rgba(255, 154, 89, 0.62);
            --magic-secondary: rgba(255, 221, 166, 0.38);
            --magic-shadow: rgba(27, 10, 6, 0.72);
        }

        .scene-transition[data-magic="frost"] {
            --magic-primary: rgba(130, 205, 255, 0.6);
            --magic-secondary: rgba(220, 244, 255, 0.36);
            --magic-shadow: rgba(8, 15, 24, 0.74);
        }

        .scene-transition[data-magic="shadow"] {
            --magic-primary: rgba(145, 116, 255, 0.54);
            --magic-secondary: rgba(246, 90, 146, 0.34);
            --magic-shadow: rgba(10, 7, 20, 0.8);
        }

        .scene-transition__veil,
        .scene-transition__ring,
        .scene-transition__spark {
            position: absolute;
            inset: 0;
        }

        .scene-transition__veil {
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.22) 0 8%, transparent 24%),
                radial-gradient(circle at center, transparent 0 18%, var(--magic-secondary) 38%, transparent 60%),
                radial-gradient(circle at center, transparent 0 38%, var(--magic-primary) 68%, var(--magic-shadow) 100%);
            transform: scale(0.88);
            animation: magicVeil 980ms ease both;
        }

        .scene-transition__ring {
            inset: 14%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 64px var(--magic-primary),
                inset 0 0 42px var(--magic-primary);
            animation: magicRing 1080ms cubic-bezier(0.2, 0.8, 0.16, 1) both;
        }

        .scene-transition__spark {
            inset: auto;
            width: 34vmin;
            height: 34vmin;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(255, 255, 255, 0.94) 0 5%, var(--magic-primary) 26%, transparent 74%);
            mix-blend-mode: screen;
            filter: blur(10px);
            opacity: 0;
        }

        .scene-transition__spark--a {
            top: 18%;
            left: 14%;
            animation: magicSparkA 820ms ease both;
        }

        .scene-transition__spark--b {
            right: 10%;
            bottom: 14%;
            animation: magicSparkB 860ms ease both;
        }

        .world-panel,
        .utility-cluster,
        .loading-card,
        .toast,
        .drop-card,
        .hint-chip {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }

        .world-panel,
        .utility-cluster,
        .loading-card,
        .toast-stack,
        .hint-chip {
            position: absolute;
            z-index: 3;
        }

        .world-panel {
            top: max(34px, env(safe-area-inset-top));
            left: max(34px, env(safe-area-inset-left));
            width: min(252px, calc(100vw - 108px));
            padding: 7px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--line-soft);
            background:
                linear-gradient(180deg, rgba(20, 21, 28, 0.84), rgba(14, 16, 22, 0.54)),
                var(--panel-bg);
        }

        .mini-btn,
        .current-world,
        .scene-card {
            transition: transform var(--transition), border-color var(--transition), background var(--transition), opacity var(--transition);
        }

        .mini-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            cursor: pointer;
            font-size: 12px;
        }

        .mini-btn:hover,
        .current-world:hover,
        .scene-card:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .mini-btn-icon {
            width: 30px;
            padding: 0;
            border-radius: 999px;
            font-size: 16px;
            line-height: 1;
        }

        .current-world {
            width: 100%;
            display: grid;
            grid-template-columns: 74px 1fr;
            gap: 10px;
            align-items: center;
            padding: 7px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.035);
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .current-world img,
        .scene-card img {
            width: 100%;
            object-fit: cover;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .current-world img {
            height: 46px;
        }

        .current-world-copy {
            min-width: 0;
        }

        .current-world-copy strong,
        .scene-card strong {
            display: block;
            font-size: 14px;
            line-height: 1.3;
        }

        .current-world-copy strong {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-world-copy span,
        .scene-card span {
            display: block;
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 11px;
            line-height: 1.45;
        }

        .current-world-copy span {
            display: none;
        }

        .scene-rail {
            display: grid;
            gap: 8px;
            margin-top: 10px;
            max-height: 236px;
            overflow-y: auto;
            scrollbar-width: none;
            transition: max-height var(--transition), opacity var(--transition), margin-top var(--transition);
        }

        .scene-rail::-webkit-scrollbar {
            display: none;
        }

        .scene-rail.is-collapsed {
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
        }

        .scene-card {
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 10px;
            align-items: center;
            padding: 7px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .scene-card img {
            height: 48px;
        }

        .scene-card.is-active {
            border-color: var(--line-strong);
            background: linear-gradient(180deg, rgba(255, 197, 111, 0.14), rgba(255, 255, 255, 0.04));
        }

        .utility-cluster {
            top: max(34px, env(safe-area-inset-top));
            right: max(34px, env(safe-area-inset-right));
            display: flex;
            gap: 8px;
        }

        .mini-btn.is-active {
            border-color: rgba(255, 197, 111, 0.46);
            background: rgba(255, 197, 111, 0.18);
            color: #fff6e6;
        }

        .drop-layer {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 7, 10, 0.46);
            border: 1px dashed rgba(255, 255, 255, 0.18);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            z-index: 4;
        }

        .drop-layer.is-visible {
            opacity: 1;
        }

        .drop-card {
            max-width: 320px;
            padding: 18px 20px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(16, 18, 24, 0.84);
            text-align: center;
        }

        .drop-card strong {
            display: block;
            font-size: 20px;
            letter-spacing: -0.03em;
        }

        .drop-card span {
            display: block;
            margin-top: 8px;
            color: var(--text-soft);
            font-size: 13px;
            line-height: 1.6;
        }

        .loading-card {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(260px, calc(100vw - 64px));
            padding: 14px 14px 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(16, 18, 24, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            text-align: center;
            overflow: hidden;
            --magic-primary: rgba(255, 197, 111, 0.52);
            --magic-secondary: rgba(255, 242, 213, 0.3);
        }

        .loading-card::before {
            content: "";
            position: absolute;
            inset: -24% -10%;
            background:
                radial-gradient(circle at center, var(--magic-secondary), transparent 48%),
                linear-gradient(120deg, transparent 0 24%, var(--magic-primary) 48%, transparent 72%);
            opacity: 0.34;
            animation: loadingSheen 1.2s linear infinite;
        }

        .loading-card[data-magic="ember"] {
            --magic-primary: rgba(255, 154, 89, 0.52);
            --magic-secondary: rgba(255, 221, 166, 0.24);
        }

        .loading-card[data-magic="frost"] {
            --magic-primary: rgba(130, 205, 255, 0.48);
            --magic-secondary: rgba(220, 244, 255, 0.24);
        }

        .loading-card[data-magic="shadow"] {
            --magic-primary: rgba(145, 116, 255, 0.44);
            --magic-secondary: rgba(246, 90, 146, 0.18);
        }

        .loading-card.is-visible {
            opacity: 1;
        }

        .loading-card.is-ambient {
            width: auto;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .loading-card.is-ambient::before,
        .loading-card.is-ambient .loading-progress,
        .loading-card.is-ambient .loading-progress-text {
            display: none;
        }

        .loading-card.is-ambient .loading-runes {
            margin-bottom: 0;
            gap: 8px;
        }

        .loading-card.is-ambient .loading-runes span {
            width: 9px;
            height: 9px;
        }

        .loading-card.is-ambient #loadingLabel {
            display: none;
        }

        .loading-card > * {
            position: relative;
            z-index: 1;
        }

        .loading-card span {
            display: block;
            font-size: 12px;
            color: var(--text-soft);
        }

        .loading-runes {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .loading-runes span {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--magic-primary);
            box-shadow: 0 0 18px var(--magic-primary);
            animation: loadingRunePulse 1s ease infinite;
        }

        .loading-runes span:nth-child(2) {
            animation-delay: 120ms;
        }

        .loading-runes span:nth-child(3) {
            animation-delay: 240ms;
        }

        .loading-progress {
            margin-top: 10px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .loading-progress i {
            display: block;
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.22), var(--magic-primary) 40%, rgba(255, 255, 255, 0.92));
            box-shadow: 0 0 16px var(--magic-primary);
            transition: width 120ms ease;
        }

        .loading-progress-text {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.66);
        }

        .toast-stack {
            left: 50%;
            bottom: max(36px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(360px, calc(100vw - 40px));
            pointer-events: none;
        }

        .toast {
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(16, 18, 24, 0.78);
            color: var(--text-main);
            font-size: 12px;
            line-height: 1.5;
        }

        .toast.is-error {
            border-color: rgba(255, 124, 124, 0.34);
            color: #ffe8e8;
        }

        .hint-chip {
            left: 50%;
            bottom: max(42px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(16, 18, 24, 0.54);
            color: rgba(255, 255, 255, 0.72);
            font-size: 11px;
            letter-spacing: 0.04em;
            pointer-events: none;
            transition: opacity 320ms ease;
        }

        .hint-chip.is-hidden {
            opacity: 0;
        }

        @keyframes magicVeil {
            0% {
                opacity: 0;
                transform: scale(0.74);
            }
            24% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.26);
            }
        }

        @keyframes magicRing {
            0% {
                opacity: 0;
                transform: scale(0.62) rotate(0deg);
            }
            30% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.22) rotate(38deg);
            }
        }

        @keyframes magicSparkA {
            0% {
                opacity: 0;
                transform: translate3d(-28px, 12px, 0) scale(0.6);
            }
            40% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
                transform: translate3d(40px, -20px, 0) scale(1.34);
            }
        }

        @keyframes magicSparkB {
            0% {
                opacity: 0;
                transform: translate3d(24px, -12px, 0) scale(0.54);
            }
            36% {
                opacity: 0.92;
            }
            100% {
                opacity: 0;
                transform: translate3d(-42px, 18px, 0) scale(1.28);
            }
        }

        @keyframes loadingSheen {
            0% {
                transform: translateX(-26%);
            }
            100% {
                transform: translateX(26%);
            }
        }

        @keyframes loadingRunePulse {
            0%,
            100% {
                transform: scale(0.7);
                opacity: 0.46;
            }
            50% {
                transform: scale(1.18);
                opacity: 1;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @media (max-width: 820px) {
            #viewer,
            .edge-vignette,
            .stage-frame,
            .grain,
            .drop-layer,
            .scene-transition {
                inset: 12px;
                border-radius: 24px;
            }

            .world-panel {
                top: max(18px, env(safe-area-inset-top));
                left: max(18px, env(safe-area-inset-left));
                width: min(214px, calc(100vw - 104px));
                padding: 6px;
            }

            .utility-cluster {
                top: max(18px, env(safe-area-inset-top));
                right: max(18px, env(safe-area-inset-right));
            }

            .current-world {
                grid-template-columns: 62px 1fr;
                gap: 8px;
                padding: 6px;
            }

            .current-world img {
                height: 40px;
            }

            .scene-card {
                grid-template-columns: 56px 1fr;
            }

            .scene-card img {
                height: 42px;
            }
        }

        @media (max-width: 560px) {
            .world-panel {
                width: calc(100vw - 112px);
                max-width: 196px;
                padding: 5px;
            }

            .mini-btn {
                height: 28px;
                padding: 0 9px;
                font-size: 11px;
            }

            .mini-btn-icon {
                width: 28px;
                padding: 0;
                font-size: 15px;
            }

            .current-world-copy strong,
            .scene-card strong {
                font-size: 13px;
            }

            .current-world {
                grid-template-columns: 54px 1fr;
                gap: 7px;
                padding: 5px;
            }

            .current-world img {
                height: 34px;
                border-radius: 10px;
            }

            .current-world-copy span,
            .scene-card span {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="viewer-shell">
        <div id="viewer" aria-label="360 全景查看区域"></div>
        <div class="grain"></div>
        <div class="edge-vignette"></div>
        <div class="stage-frame"></div>
        <div class="scene-transition" id="sceneTransition" data-magic="gold" aria-hidden="true">
            <div class="scene-transition__veil"></div>
            <div class="scene-transition__ring"></div>
            <div class="scene-transition__spark scene-transition__spark--a"></div>
            <div class="scene-transition__spark scene-transition__spark--b"></div>
        </div>

        <section class="world-panel" aria-live="polite">
            <button class="current-world" id="worldFocus" type="button" aria-expanded="false">
                <img id="currentWorldThumb" alt="当前世界预览">
                <div class="current-world-copy">
                    <strong id="sceneTitle">载入中</strong>
                </div>
            </button>

            <div class="scene-rail is-collapsed" id="sceneRail" aria-label="世界列表"></div>
        </section>

        <div class="utility-cluster">
            <button class="mini-btn mini-btn-icon" id="uploadButton" type="button" aria-label="载入图片" title="载入图片">+</button>
            <button class="mini-btn is-active" id="autorotateToggle" type="button" aria-pressed="true">轮转 开</button>
        </div>

        <div class="hint-chip" id="gestureHint">拖动环视，滚轮或双指缩放</div>

        <div class="drop-layer" id="dropLayer">
            <div class="drop-card">
                <strong>把全景图扔进来</strong>
                <span>会直接加入左上角世界列表。非 2:1 图片也能打开，只是沉浸感会差一点。</span>
            </div>
        </div>

        <div class="loading-card is-visible" id="loadingCard">
            <div class="loading-runes" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span id="loadingLabel">正在打开魔法世界…</span>
            <div class="loading-progress" aria-hidden="true"><i id="loadingProgressBar"></i></div>
            <div class="loading-progress-text" id="loadingProgressText">6%</div>
        </div>

        <div class="toast-stack" id="toastStack" aria-live="polite"></div>

        <input class="sr-only" id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        <audio id="bgmAudio" src="./assets/audio/owl-post-dawn.mp3" preload="auto" loop></audio>
    </div>

    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js";
        const HP_01_DIAGON_ALLEY_DATA_URL = "https://atou.cc/web-toys/assets/images/diagon-4k.png";
        const HP_02_PLATFORM_DATA_URL = "https://atou.cc/web-toys/assets/images/platform-4k.png";
        const HP_03_HOGWARTS_DATA_URL = "https://atou.cc/web-toys/assets/images/hogwarts-overlook-4k.png";
        const HP_04_GREAT_HALL_DATA_URL = "https://atou.cc/web-toys/assets/images/great-hall-4k.png";
        const HP_05_COMMON_ROOM_DATA_URL = "https://atou.cc/web-toys/assets/images/common-room-4k.png";
        const HP_06_STAIRCASES_DATA_URL = "https://atou.cc/web-toys/assets/images/staircases-4k.png";

        async function init() {
            try {
                initViewer();
                wireEvents();
                seedDemoScenes();
                renderSceneRail();
                syncAutoRotateButton();
                const initialScene = findInitialScene();
                await activateScene(initialScene.id, { resetView: true, initial: true });
                primeBgm();
                animate();
                setTimeout(() => {
                    gestureHint.classList.add("is-hidden");
                }, 4200);
            } catch (error) {
                console.error(error);
                showToast(`页面初始化失败：${error.message}`, true);
                loadingCard.classList.remove("is-visible");
            }

        function initViewer() {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            viewer.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(state.fov, window.innerWidth / window.innerHeight, 1, 1100);

            const geometry = new THREE.SphereGeometry(500, 96, 64);
            geometry.scale(-1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            sphereMesh = new THREE.Mesh(geometry, material);
            scene.add(sphereMesh);
        }

        function wireEvents() {
            window.addEventListener("resize", handleResize);
            viewer.addEventListener("pointerdown", handlePointerDown);
            viewer.addEventListener("pointermove", handlePointerMove);
            viewer.addEventListener("pointerup", handlePointerUp);
            viewer.addEventListener("pointercancel", handlePointerUp);
            viewer.addEventListener("wheel", handleWheel, { passive: false });

            document.addEventListener("keydown", handleKeydown);
            document.addEventListener("paste", handlePaste);

            ["dragenter", "dragover"].forEach((eventName) => {
                window.addEventListener(eventName, handleDragEnter, { passive: false });
            });
            ["dragleave", "drop"].forEach((eventName) => {
                window.addEventListener(eventName, handleDragLeave, { passive: false });
            });
            window.addEventListener("drop", handleDrop, { passive: false });
            window.addEventListener("pagehide", handlePageHide);
            window.addEventListener("beforeunload", handlePageHide);
            document.addEventListener("visibilitychange", handleVisibilityChange);

            uploadButton.addEventListener("click", () => fileInput.click());
            fileInput.addEventListener("change", async (event) => {
                const files = Array.from(event.target.files || []);
                if (files.length) {
                    await importScenesFromFiles(files);
                    fileInput.value = "";
                }
            });

            autorotateToggle.addEventListener("click", () => {
                state.autoRotate = !state.autoRotate;
                syncAutoRotateButton();
            });

            worldFocus.addEventListener("click", () => {
                const collapsed = sceneRail.classList.toggle("is-collapsed");
                worldFocus.setAttribute("aria-expanded", String(!collapsed));
            });
        }

        function seedDemoScenes() {
            state.scenes.push(...BUILTIN_WORLDS);

        function findInitialScene() {
            const fromHash = location.hash.replace(/^#/, "");
            return state.scenes.find((sceneItem) => sceneItem.id === fromHash) || state.scenes[0];
        }

        async function activateScene(sceneId, options = {}) {
            const nextScene = state.scenes.find((sceneItem) => sceneItem.id === sceneId);
            if (!nextScene) {
                throw new Error("没找到要切换的场景");
            }

            const isInitial = Boolean(options.initial);
            showLoading(`正在载入「${nextScene.title}」`, nextScene, { initial: isInitial });
            try {
                if (!isInitial) {
                    await wait(180);
                }
                const texture = await loadTexture(nextScene.textureSource, (progress) => {
                    if (typeof progress === "number" && Number.isFinite(progress)) {
                        setLoadingProgress(progress);
                    }
                });
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

                if (state.texture) {
                    state.texture.dispose();
                }

                state.texture = texture;
                sphereMesh.material.map = texture;
                sphereMesh.material.needsUpdate = true;
                state.currentSceneId = sceneId;

                if (options.resetView) {
                    state.lon = 0;
                    state.lat = 0;
                    state.targetLon = 0;
                    state.targetLat = 0;
                }

                updateSceneHeadline(nextScene);
                renderSceneRail();
                location.hash = sceneId;
            } finally {
                await hideLoading({ initial: isInitial });
            }
        }

        function loadTexture(source, onProgress = () => {}) {
            return new Promise((resolve, reject) => {
                new THREE.TextureLoader().load(
                    source,
                    (texture) => {
                        onProgress(1);
                        resolve(texture);
                    },
                    (event) => {
                        if (event && event.lengthComputable && event.total > 0) {
                            onProgress(event.loaded / event.total);
                        }
                    },
                    () => reject(new Error("图片载入失败，请确认文件没有损坏"))
                );
            });
        }

        function updateSceneHeadline(sceneItem) {
            sceneTitle.textContent = sceneItem.title;
            currentWorldThumb.src = sceneItem.thumbnail;
            currentWorldThumb.alt = sceneItem.title;
        }

        function renderSceneRail() {
            sceneRail.innerHTML = "";
            for (const sceneItem of state.scenes) {
                const button = document.createElement("button");
                button.className = `scene-card${sceneItem.id === state.currentSceneId ? " is-active" : ""}`;
                button.type = "button";
                button.dataset.sceneId = sceneItem.id;
                const sceneTag = sceneItem.source === "upload" ? "<span>导入图片</span>" : "";
                button.innerHTML = `
                    <img src="${sceneItem.thumbnail}" alt="${sceneItem.title}">
                    <div>
                        <strong>${sceneItem.title}</strong>
                        ${sceneTag}
                    </div>
                `;
                button.addEventListener("click", async () => {
                    try {
                        await activateScene(sceneItem.id);
                        if (window.innerWidth <= 560) {
                            sceneRail.classList.add("is-collapsed");
                            worldFocus.setAttribute("aria-expanded", "false");
                        }
                    } catch (error) {
                        console.error(error);
                        showToast(error.message, true);
                    }
                });
                sceneRail.appendChild(button);
            }
        }

        async function importScenesFromFiles(files) {
            const imageFiles = files.filter((file) => file.type.startsWith("image/"));
            if (!imageFiles.length) {
                throwAndToast("没收到可用图片，支持 JPG、PNG、WEBP。");
                return;
            }

            const additions = [];
            for (const file of imageFiles) {
                const objectUrl = URL.createObjectURL(file);
                try {
                    const metadata = await readImageMetadata(objectUrl);
                    const ratio = metadata.width / metadata.height;
                    if (Math.abs(ratio - 2) > 0.2) {
                        showToast(`「${file.name}」不是标准 2:1，全景可能会被拉伸。`, false);
                    }

                    additions.push({
                        id: `upload-${crypto.randomUUID()}`,
                        title: trimFileName(file.name),
                        description: `${metadata.width} × ${metadata.height}`,
                        source: "upload",
                        textureSource: objectUrl,
                        thumbnail: objectUrl
                    });
                } catch (error) {
                    URL.revokeObjectURL(objectUrl);
                    throw new Error(`「${file.name}」读取失败：${error.message}`);
                }
            }

            state.scenes.push(...additions);
            renderSceneRail();
            await activateScene(additions[0].id, { resetView: true });
            showToast(`已导入 ${additions.length} 张全景图`);
        }

        function readImageMetadata(source) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
                img.onerror = () => reject(new Error("文件不是有效图片"));
                img.src = source;
            });
        }

        function trimFileName(fileName) {
            return fileName.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim() || "未命名场景";
        }

        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handlePointerDown(event) {
            gestureHint.classList.add("is-hidden");
            primeBgm(true);
            viewer.setPointerCapture(event.pointerId);
            state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

            if (state.pointers.size === 1) {
                state.isDragging = true;
                state.primaryPointerId = event.pointerId;
                state.pointerOrigin = {
                    x: event.clientX,
                    y: event.clientY,
                    lon: state.targetLon,
                    lat: state.targetLat
                };
                document.body.classList.add("dragging");
            }

            if (state.pointers.size === 2) {
                state.isDragging = false;
                state.pinchStartDistance = getPointerDistance();
                state.pinchStartFov = state.fov;
            }
        }

        function handlePointerMove(event) {
            if (!state.pointers.has(event.pointerId)) {
                return;
            }
            state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

            if (state.gyroActive) {
                return;
            }

            if (state.pointers.size === 2 && state.pinchStartDistance) {
                const nextDistance = getPointerDistance();
                const factor = state.pinchStartDistance / Math.max(nextDistance, 1);
                setFov(state.pinchStartFov * factor);
                return;
            }

            if (!state.isDragging || event.pointerId !== state.primaryPointerId) {
                return;
            }

            const deltaX = event.clientX - state.pointerOrigin.x;
            const deltaY = event.clientY - state.pointerOrigin.y;
            state.targetLon = state.pointerOrigin.lon - deltaX * 0.12;
            state.targetLat = clamp(state.pointerOrigin.lat + deltaY * 0.09, -82, 82);
        }

        function handlePointerUp(event) {
            state.pointers.delete(event.pointerId);
            if (state.primaryPointerId === event.pointerId) {
                state.isDragging = false;
                state.primaryPointerId = null;
                document.body.classList.remove("dragging");
            }
            if (state.pointers.size < 2) {
                state.pinchStartDistance = null;
            }
        }

        function getPointerDistance() {
            const values = [...state.pointers.values()];
            if (values.length < 2) {
                return 0;
            }
            return Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y);
        }

        function handleWheel(event) {
            event.preventDefault();
            gestureHint.classList.add("is-hidden");
            setFov(state.fov + event.deltaY * 0.02);
        }

        function handleKeydown(event) {
            if (event.target instanceof HTMLInputElement) {
                return;
            }
            primeBgm(true);
            if (event.key === "ArrowLeft") {
                state.targetLon += 7;
            } else if (event.key === "ArrowRight") {
                state.targetLon -= 7;
            } else if (event.key === "ArrowUp") {
                state.targetLat = clamp(state.targetLat - 5, -82, 82);
            } else if (event.key === "ArrowDown") {
                state.targetLat = clamp(state.targetLat + 5, -82, 82);
            } else if (event.key === "+" || event.key === "=") {
                setFov(state.fov - 3);
            } else if (event.key === "-" || event.key === "_") {
                setFov(state.fov + 3);
            } else if (event.code === "Space") {
                event.preventDefault();
                autorotateToggle.click();
            }
        }

        function setFov(nextFov) {
            state.fov = clamp(nextFov, 38, 92);
            camera.fov = state.fov;
            camera.updateProjectionMatrix();
        }

        function syncAutoRotateButton() {
            autorotateToggle.textContent = `轮转 ${state.autoRotate ? "开" : "关"}`;
            autorotateToggle.classList.toggle("is-active", state.autoRotate);
            autorotateToggle.setAttribute("aria-pressed", String(state.autoRotate));
        }

        function animate() {
            requestAnimationFrame(animate);

            if (state.gyroActive && orientationState.alpha !== null) {
                updateCameraFromDeviceOrientation();
            } else {
                if (!state.isDragging && state.autoRotate) {
                    state.targetLon -= 0.015;
                }
                state.lon += (state.targetLon - state.lon) * 0.08;
                state.lat += (state.targetLat - state.lat) * 0.08;
                state.lat = clamp(state.lat, -85, 85);

                const phi = THREE.MathUtils.degToRad(90 - state.lat);
                const theta = THREE.MathUtils.degToRad(state.lon);
                const target = new THREE.Vector3(
                    500 * Math.sin(phi) * Math.cos(theta),
                    500 * Math.cos(phi),
                    500 * Math.sin(phi) * Math.sin(theta)
                );
                camera.lookAt(target);
            }

            renderer.render(scene, camera);
        }

        async function toggleGyro(shouldEnable) {
            if (!window.DeviceOrientationEvent) {
                showToast("这个设备不支持方向感应。", true);
                return;
            }

            if (shouldEnable) {
                try {
                    if (typeof DeviceOrientationEvent.requestPermission === "function") {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission !== "granted") {
                            throw new Error("没有拿到方向感应权限");
                        }
                    }
                    window.addEventListener("deviceorientation", handleDeviceOrientation, true);
                    window.addEventListener("orientationchange", handleDeviceOrientation, true);
                    state.gyroActive = true;
                    showToast("方向感应已打开");
                    clearTimeout(gyroWatchdog);
                    gyroWatchdog = window.setTimeout(() => {
                        if (state.gyroActive && orientationState.alpha === null) {
                            toggleGyro(false);
                            showToast("没收到设备姿态数据，浏览器或设备可能不支持。", true);
                        }
                    }, 1800);
                } catch (error) {
                    state.gyroActive = false;
                    showToast(error.message, true);
                }
                return;
            }

            state.gyroActive = false;
            clearTimeout(gyroWatchdog);
            window.removeEventListener("deviceorientation", handleDeviceOrientation, true);
            window.removeEventListener("orientationchange", handleDeviceOrientation, true);
            showToast("方向感应已关闭");
        }

        function handleDeviceOrientation(event) {
            if (event.type === "orientationchange") {
                return;
            }
            orientationState.alpha = event.alpha === null ? null : THREE.MathUtils.degToRad(event.alpha);
            orientationState.beta = event.beta === null ? null : THREE.MathUtils.degToRad(event.beta);
            orientationState.gamma = event.gamma === null ? null : THREE.MathUtils.degToRad(event.gamma);
        }

        function updateCameraFromDeviceOrientation() {
            const alpha = orientationState.alpha ?? 0;
            const beta = orientationState.beta ?? 0;
            const gamma = orientationState.gamma ?? 0;
            const orient = getScreenOrientationAngle();

            deviceEuler.set(beta, alpha, -gamma, "YXZ");
            camera.quaternion.setFromEuler(deviceEuler);
            camera.quaternion.multiply(q1);
            camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
        }

        function getScreenOrientationAngle() {
            if (window.screen?.orientation?.angle !== undefined) {
                return THREE.MathUtils.degToRad(window.screen.orientation.angle);
            }
            return THREE.MathUtils.degToRad(window.orientation || 0);
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                showToast(`全屏失败：${error.message}`, true);
            }
        }

        function handlePaste(event) {
            const items = Array.from(event.clipboardData?.items || []);
            const imageFiles = items
                .filter((item) => item.type.startsWith("image/"))
                .map((item) => item.getAsFile())
                .filter(Boolean);
            if (!imageFiles.length) {
                return;
            }
            importScenesFromFiles(imageFiles).catch((error) => {
                console.error(error);
                showToast(error.message, true);
            });
        }

        function handleDragEnter(event) {
            event.preventDefault();
            dropLayer.classList.add("is-visible");
        }

        function handleDragLeave(event) {
            event.preventDefault();
            if (event.type === "dragleave" && event.relatedTarget) {
                return;
            }
            dropLayer.classList.remove("is-visible");
        }

        function handleDrop(event) {
            event.preventDefault();
            dropLayer.classList.remove("is-visible");
            const files = Array.from(event.dataTransfer?.files || []);
            if (!files.length) {
                return;
            }
            importScenesFromFiles(files).catch((error) => {
                console.error(error);
                showToast(error.message, true);
            });
        }

        function handlePageHide() {
            stopBgm();
        }

        function handleVisibilityChange() {
            if (document.visibilityState === "hidden") {
                stopBgm();
            }
        }

        function getSceneMagic(sceneItem) {
            if (!sceneItem || sceneItem.source === "upload") {
                return "gold";
            }
            const id = sceneItem.id;
            if (id.includes("black-lake") || id.includes("hogsmeade") || id.includes("patronus")) {
                return "frost";
            }
            if (id.includes("graveyard") || id.includes("mysteries") || id.includes("final-duel") || id.includes("chamber")) {
                return "shadow";
            }
            if (id.includes("dragon") || id.includes("quidditch") || id.includes("battle")) {
                return "ember";
            }
            return "gold";
        }

        function showLoading(text, sceneItem, options = {}) {
            loadingLabel.textContent = text;
            const magic = getSceneMagic(sceneItem);
            loadingCard.dataset.magic = magic;
            sceneTransition.dataset.magic = magic;
            loadingCard.classList.toggle("is-ambient", !options.initial);
            if (options.initial) {
                state.loadingProgressTarget = 0.06;
                state.loadingProgressVisual = 0;
                renderLoadingProgress(0.06);
                startLoadingProgressLoop();
                loadingCard.classList.add("is-visible");
                sceneTransition.classList.remove("is-visible");
                return;
            }
            stopLoadingProgressLoop();
            renderLoadingProgress(0);
            loadingCard.classList.add("is-visible");
            sceneTransition.classList.remove("is-visible");
            void sceneTransition.offsetWidth;
            sceneTransition.classList.add("is-visible");
        }

        async function hideLoading(options = {}) {
            if (options.initial) {
                setLoadingProgress(1);
            }
            await wait(options.initial ? 220 : 120);
            loadingCard.classList.remove("is-visible");
            loadingCard.classList.remove("is-ambient");
            if (!options.initial) {
                await wait(760);
                sceneTransition.classList.remove("is-visible");
            }
            stopLoadingProgressLoop();
        }

        function setLoadingProgress(value) {
            if (!Number.isFinite(value)) {
                return;
            }
            state.loadingProgressTarget = clamp(value, state.loadingProgressTarget, 1);
        }

        function startLoadingProgressLoop() {
            stopLoadingProgressLoop();
            loadingProgressTimer = window.setInterval(() => {
                const idleCeiling = Math.min(state.loadingProgressTarget + 0.12, 0.9);
                if (state.loadingProgressTarget < 0.9) {
                    state.loadingProgressTarget = Math.max(state.loadingProgressTarget, idleCeiling);
                }
                state.loadingProgressVisual += (state.loadingProgressTarget - state.loadingProgressVisual) * 0.22;
                if (state.loadingProgressTarget >= 1 && Math.abs(state.loadingProgressVisual - 1) < 0.01) {
                    state.loadingProgressVisual = 1;
                }
                renderLoadingProgress(state.loadingProgressVisual);
            }, 48);
        }

        function stopLoadingProgressLoop() {
            window.clearInterval(loadingProgressTimer);
            loadingProgressTimer = null;
            state.loadingProgressTarget = 0;
            state.loadingProgressVisual = 0;
        }

        function renderLoadingProgress(value) {
            const percent = Math.round(clamp(value, 0, 1) * 100);
            loadingProgressBar.style.width = `${percent}%`;
            loadingProgressText.textContent = `${percent}%`;
        }

        async function primeBgm(fromGesture = false) {
            if (!bgmAudio || state.bgmStarted) {
                return;
            }
            bgmAudio.volume = 0.48;
            try {
                await bgmAudio.play();
                state.bgmStarted = true;
            } catch (error) {
                installBgmUnlock();
                if (!fromGesture && !state.bgmPromptShown) {
                    state.bgmPromptShown = true;
                    showToast("背景音乐已待命，点一下画面就会开始。");
                }
            }
        }

        function stopBgm() {
            if (!bgmAudio) {
                return;
            }
            bgmAudio.pause();
            state.bgmStarted = false;
        }

        function installBgmUnlock() {
            if (state.bgmUnlockInstalled) {
                return;
            }
            state.bgmUnlockInstalled = true;
            const unlock = () => {
                primeBgm(true).finally(() => {
                    if (state.bgmStarted) {
                        window.removeEventListener("pointerdown", unlock, true);
                        window.removeEventListener("keydown", unlock, true);
                        window.removeEventListener("touchstart", unlock, true);
                    }
                });
            };
            window.addEventListener("pointerdown", unlock, true);
            window.addEventListener("keydown", unlock, true);
            window.addEventListener("touchstart", unlock, true);
        }

        function wait(ms) {
            return new Promise((resolve) => {
                window.setTimeout(resolve, ms);
            });
        }

        function showToast(message, isError = false) {
            const toast = document.createElement("div");
            toast.className = `toast${isError ? " is-error" : ""}`;
            toast.textContent = message;
            toastStack.appendChild(toast);
            window.setTimeout(() => {
                toast.remove();
            }, isError ? 5200 : 3200);
        }

        function throwAndToast(message) {
            showToast(message, true);
            throw new Error(message);
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }
    </script>
</body>
</html>
